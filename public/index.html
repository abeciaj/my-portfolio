<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jayllan Abecia | Cloud & DevOps Engineer</title>
    <meta
      name="description"
      content="Jayllan Abecia is a Cloud & DevOps Engineer working with AWS, Azure, Google Cloud, Kubernetes, Terraform and Ansible."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jayllan Abecia | Cloud & DevOps Engineer" />
    <meta
      property="og:description"
      content="Cloud, DevOps and infrastructure services across AWS, Azure, Google Cloud and Kubernetes."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>

  </body>
</html>
