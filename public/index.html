<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Defaults for `npm start`. In production, scripts/build-pages.mjs replaces
      the title, description and social/structured-data tags for each page.
    -->
    <title>Jayllan Abecia | Freelance Cloud & DevOps Engineer, Melbourne</title>
    <meta
      name="description"
      content="Melbourne-based freelance Cloud & DevOps Engineer helping teams build, automate and run infrastructure on AWS, Azure, Google Cloud and Kubernetes."
    />
    <meta name="google-site-verification" content="BVdxRpWH2QuU1L_m80kJUFVhda34oRFbSwwPVtv86q8" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
